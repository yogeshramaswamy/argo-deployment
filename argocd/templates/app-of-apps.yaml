# App of Apps - this Application watches the apps/ directory
# and deploys all Application CRs found there
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hayes-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yogeshramaswamy/argo-deployment.git
    targetRevision: main
    path: apps/stag
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
