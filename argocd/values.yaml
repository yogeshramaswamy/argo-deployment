# Argo CD Helm Chart Values
# Source: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
# Deployed via: ./bootstrap/install.sh stag

global:
  domain: hayes-argocd-stag.hayesinc.com
  environment: stag

argo-cd:
  server:
    replicas: 2

    ingress:
      enabled: false

    extraArgs:
      - --insecure

  repoServer:
    replicas: 2

  controller:
    replicas: 1

  redis-ha:
    enabled: false

  redis:
    enabled: true

  configs:
    params:
      server.insecure: true

    cm:
      accounts.admin: apiKey, login
      admin.enabled: "true"

      url: __ARGOCD_URL__

      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: __GITHUB_APP_CLIENT_ID__
              clientSecret: $dex.github.clientSecret
              orgs:
                - name: symplr-software
                  teams:
                    - csm-argocd-admins

    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, symplr-software:csm-argocd-admins, role:admin

    secret:
      createSecret: true

  applicationSet:
    replicas: 2

  notifications:
    enabled: false
